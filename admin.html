<!doctype html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ҰСТАЗ AI — Әкімші</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f4f6ff;color:#172033}
    .wrap{max-width:1100px;margin:0 auto;padding:18px}
    .card{background:#fff;border:1px solid #dbe1fb;border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
    .btn{border:none;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700}
    .btn.primary{background:#5b4cf3;color:#fff}
    .btn.red{background:#fff0f0;color:#d92d20}
    .btn.green{background:#e8fff3;color:#067647}
    .btn.light{background:#eef2ff;color:#4f46e5}
    .hidden{display:none!important}
    .muted{color:#667085}
    .item{border:1px solid #e4e7ec;border-radius:16px;padding:14px;margin-top:10px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  </style>
</head>
<body>
<div class="wrap">
  <div id="loginBox" class="card">
    <h1>Әкімші панелі</h1>
    <p class="muted">Тек иесі ғана кіре алады.</p>
    <button id="loginBtn" class="btn primary">Google аккаунтымен кіру</button>
  </div>

  <div id="deniedBox" class="card hidden">
    <h2>Қолжетімсіз</h2>
    <p>Бұл бетке тек иесінің аккаунты кіре алады.</p>
  </div>

  <div id="adminBox" class="hidden">
    <div class="card top">
      <div>
        <h2>Рұқсаттарды басқару</h2>
        <div class="muted" id="adminEmail"></div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a href="index.html" class="btn light" style="text-decoration:none">Негізгі бет</a>
        <button id="logoutBtn" class="btn red">Шығу</button>
      </div>
    </div>

    <div class="card">
      <h3>Күтіп тұрған сұраныстар</h3>
      <div id="pendingList">Жүктелуде...</div>
    </div>

    <div class="card">
      <h3>Белсенді лицензиялар</h3>
      <div id="activeList">Жүктелуде...</div>
    </div>
  </div>
</div>

<script type="module">
import {
  auth, provider, db, OWNER_EMAIL,
  signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged,
  collection, getDocs, doc, setDoc, updateDoc, getDoc, serverTimestamp
} from "./firebase-config.js";

const $ = (id)=>document.getElementById(id);
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
let adminUser = null;

async function login(){
  try{
    if(isMobile) await signInWithRedirect(auth, provider);
    else await signInWithPopup(auth, provider);
  }catch(e){
    console.error(e);
    alert("Кіру қатесі");
  }
}

async function logoutNow(){ await signOut(auth); }

function showLogin(){
  $("loginBox").classList.remove("hidden");
  $("deniedBox").classList.add("hidden");
  $("adminBox").classList.add("hidden");
}
function showDenied(){
  $("loginBox").classList.add("hidden");
  $("deniedBox").classList.remove("hidden");
  $("adminBox").classList.add("hidden");
}
function showAdmin(user){
  $("loginBox").classList.add("hidden");
  $("deniedBox").classList.add("hidden");
  $("adminBox").classList.remove("hidden");
  $("adminEmail").textContent = user.email || "";
}

async function approveUser(uid){
  const reqSnap = await getDoc(doc(db, "access_requests", uid));
  if(!reqSnap.exists()) return;

  const req = reqSnap.data();
  const expires = new Date();
  expires.setFullYear(expires.getFullYear() + 1);

  await setDoc(doc(db, "licenses", uid), {
    uid,
    email: req.email || "",
    displayName: req.displayName || "",
    status: "active",
    activatedAt: serverTimestamp(),
    expiresAt: expires,
    approvedBy: OWNER_EMAIL
  }, { merge:true });

  await updateDoc(doc(db, "access_requests", uid), {
    status: "active",
    updatedAt: serverTimestamp()
  });

  await loadData();
}

async function revokeUser(uid){
  await setDoc(doc(db, "licenses", uid), {
    status: "revoked",
    updatedAt: serverTimestamp()
  }, { merge:true });

  const reqRef = doc(db, "access_requests", uid);
  const reqSnap = await getDoc(reqRef);
  if(reqSnap.exists()){
    await updateDoc(reqRef, {
      status: "revoked",
      updatedAt: serverTimestamp()
    });
  }

  await loadData();
}

async function loadData(){
  // pending requests
  const pendingWrap = $("pendingList");
  pendingWrap.innerHTML = "";

  const reqSnap = await getDocs(collection(db, "access_requests"));
  const reqItems = [];
  reqSnap.forEach(d => reqItems.push(d.data()));

  const pending = reqItems.filter(x => (x.status || "pending") === "pending");

  if(pending.length === 0){
    pendingWrap.innerHTML = `<div class="muted">Күтіп тұрған мұғалім жоқ.</div>`;
  }else{
    pending.forEach(item => {
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <p><b>Аты:</b> ${item.displayName || "-"}</p>
        <p><b>Email:</b> ${item.email || "-"}</p>
        <p><b>UID:</b> ${item.uid || "-"}</p>
      `;
      const btn1 = document.createElement("button");
      btn1.className = "btn green";
      btn1.textContent = "Рұқсат беру";
      btn1.onclick = ()=>approveUser(item.uid);

      div.appendChild(btn1);
      pendingWrap.appendChild(div);
    });
  }

  // active licenses
  const activeWrap = $("activeList");
  activeWrap.innerHTML = "";

  const licSnap = await getDocs(collection(db, "licenses"));
  const licenses = [];
  licSnap.forEach(d => licenses.push(d.data()));

  const active = licenses.filter(x => x.status === "active");

  if(active.length === 0){
    activeWrap.innerHTML = `<div class="muted">Белсенді лицензия жоқ.</div>`;
  }else{
    active.forEach(item => {
      const exp = item.expiresAt?.toDate ? item.expiresAt.toDate().toLocaleDateString("kk-KZ") : "-";
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <p><b>Email:</b> ${item.email || "-"}</p>
        <p><b>UID:</b> ${item.uid || "-"}</p>
        <p><b>Жарамдылық мерзімі:</b> ${exp}</p>
      `;
      const btn = document.createElement("button");
      btn.className = "btn red";
      btn.textContent = "Өшіру";
      btn.onclick = ()=>revokeUser(item.uid);
      div.appendChild(btn);
      activeWrap.appendChild(div);
    });
  }
}

$("loginBtn").onclick = login;
$("logoutBtn").onclick = logoutNow;

(async function init(){
  try{ await getRedirectResult(auth); }catch(e){ console.warn(e); }

  onAuthStateChanged(auth, async(user)=>{
    adminUser = user;
    if(!user){ showLogin(); return; }

    if((user.email || "").toLowerCase() !== OWNER_EMAIL.toLowerCase()){
      showDenied();
      return;
    }

    showAdmin(user);
    await loadData();
  });
})();
</script>
</body>
</html>
